[package]
name = "oxiarc-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
arbitrary = { version = "1.4.2", features = ["derive"] }

oxiarc-core = { path = "../oxiarc-core" }
oxiarc-deflate = { path = "../oxiarc-deflate" }
oxiarc-bzip2 = { path = "../oxiarc-bzip2" }
oxiarc-lzma = { path = "../oxiarc-lzma" }
oxiarc-zstd = { path = "../oxiarc-zstd" }
oxiarc-lz4 = { path = "../oxiarc-lz4" }
oxiarc-brotli = { path = "../oxiarc-brotli" }
oxiarc-snappy = { path = "../oxiarc-snappy" }
oxiarc-lzhuf = { path = "../oxiarc-lzhuf" }
oxiarc-lzw = { path = "../oxiarc-lzw" }
oxiarc-szip = { path = "../oxiarc-szip" }
oxiarc-archive = { path = "../oxiarc-archive" }
oxiarc-http = { path = "../oxiarc-http", features = ["brotli", "zstd"] }
oxiarc-png = { path = "../oxiarc-png" }
oxiarc-jpeg = { path = "../oxiarc-jpeg" }
oxiarc-tiff = { path = "../oxiarc-tiff" }
oxiarc-image = { path = "../oxiarc-image" }

# Prevent this from interfering with workspace resolution: this crate is
# intentionally excluded from the root `[workspace]` (see /notebooks/oxiarc/Cargo.toml)
# and manages its own lockfile, per standard cargo-fuzz conventions.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "fuzz_inflate"
path = "fuzz_targets/fuzz_inflate.rs"
test = false
doc = false

