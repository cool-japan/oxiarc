# Machine-readable mirror of the "Measured L1 verdict" doc comment on every
# `#[harness]` entry point in this package, in exactly the format
# `cargo-formal`'s own `examples/checked-arith/EXPECTED.toml` uses.
#
# **MEASURED, not predicted** (2026-09-08, release `cargo-formal` 0.1.0 CLI +
# release `formal-driver` with dependency-body and monomorphic-instance
# lowering, OxiZ 0.3.3, rustc nightly-2026-06-20). The harnesses call the
# public API of `oxiarc-core`, `oxiarc-lz4` and `oxiarc-deflate` by path;
# `[package.metadata.formal] dep-crates` names those three, and the run lowered
# 28 dependency bodies (27 reachable) plus 2 monomorphic instances into the
# verification conditions. No verdict below was written before the run that
# produced it.
#
# Re-measured 2026-09-14 with a release CLI **rebuilt from the cargo-formal
# tree that carries that day's encoder rules** (the release driver, the OxiZ
# 0.3.3 pin and rustc nightly-2026-06-20 are unchanged; wall time 36 s, exit
# status 1 for the two intended refutations). Every row below, every layer
# counter and both counterexamples came back unchanged. One thing did move:
# the *reason and site* of `from_code_lengths_never_panics_harness`'s
# whole-harness refusal, which is now `aliasing` at
# `../oxiarc-deflate/src/huffman.rs:363:28` and no longer `unsupported-callee`
# at `../oxiarc-core/src/error.rs:190:22`. The verdict -- and therefore the
# row -- is the same; see that harness's row comment below.
#
# Naming. A property key is the word the **encoder actually mints**, never a
# description:
#
#   * a user-written `oxiformal::assert(..)` is `assert`; a second distinct
#     assertion raised at the *same* source site is `assert-2`, a third
#     `assert-3`, and so on.
#   * an `#[ensures]` clause checked through `#[proof_for_contract]` is
#     `ensures`, and is reported under layer `contract`. This package has none.
#   * everything else is the design section 9 closed vocabulary MIR's own
#     inserted checks produce: `arith-overflow`, `shift-overflow`,
#     `bounds-check`, `division-by-zero`, `remainder-by-zero`,
#     `division-overflow`, `neg-overflow`, `unwrap`, `expect`, `panic`,
#     `slice-range`, `unwinding-assertion`. A bare `debug_assert!` with no
#     format arguments lowers to `core::panicking::panic`, so its key is
#     `panic`, not `assert`.
#   * the pseudo-key `harness` is a **whole-harness** verdict and nothing else:
#     `"proved"` means "no obligation of this harness is anything but proved"
#     (including a harness that raises none at all), and `"unsupported"` covers
#     both `Verdict::Unsupported` and `Verdict::Unverifiable`. It is used here
#     only for the two harnesses the encoder refused whole, which generate no
#     verification condition at all.
#
# What is listed. Every obligation the harness is *about* -- its `assert`s,
# plus its `unwinding-assertion` where it has one, plus the `panic` and
# `shift-overflow` rows of the two precondition harnesses, which are their
# whole point -- and every incidental MIR-inserted check whose verdict is
# **not** `proved` (there are none). Incidental checks that came out `proved`
# are deliberately not enumerated: they are numerous, they carry no
# information, and listing them would make this file a copy of `report.json`
# rather than a statement of intent.
#
# Keying rule. `[harness.expected]` is a map, so several obligations of one
# harness that carry the same property name at *different* source sites share
# one row. The row records the **worst** of their verdicts (`refuted` >
# `timeout` > `unknown` > `unsupported`/`unverifiable` > `proved`), and a row
# comment says how many sites there are. Checked mechanically against this
# run: no such group disagrees in this package, so every row is also the
# verdict of each of its sites.
#
# Measured tally (2026-09-08; re-measured 2026-09-14, unchanged): 17 property
# rows over 13 harnesses -- 12 proved / 2 refuted / 1 timeout / 2 unsupported.
# The run's own layer counters, which include the incidental `proved` rows this
# file does not enumerate, are: bmc 505 proved / 2 refuted / 1 timeout /
# 0 unknown / 2 unsupported / 0 unverifiable over 510 obligations (508 of them
# backed by a `vc/NNNN.smt2` reproduction; the two `unsupported` ones generate
# none), and contract 0 proved / 0 refuted. Hygiene passes with 0 errors,
# 0 warnings and 0 notes over 2 files.
#
# The `audit` layer was *not* run in this invocation (`layers_run` is hygiene,
# bmc, contract), so the histogram below is the one the run's `inventory.json`
# actually records, not an audit-layer figure: `unverifiable_by_reason` is
# `raw-pointer` 1, `dyn-trait` 1, `float` 1, all three on
# `from_code_lengths_never_panics_harness` -- the only harness the inventory
# marks `unverifiable` -- and the impurity histogram over the 13 harnesses is
# `raw-pointer` 12, `dyn-dispatch` 1, `float` 1, the `raw-pointer` being the
# `Vec` deref behind `any_vec` that 12 of the 13 harnesses reach.
#
# `solver-model-rejected` count: **0**. cargo-formal is pinned to OxiZ 0.3.3,
# whose model gate (upstream item U-Z10) turns a solver model that does not
# satisfy the verification condition into `unknown` rather than an invented
# counterexample; sibling packages measured in this phase carry a large tail of
# such rows. This package has none -- there is not a single `unknown` in the
# run -- so no row here moves when the pin moves to the fixed OxiZ release.
# The one `timeout` is a different failure and does not move either: it is a
# genuinely hard bit-blasting problem (see the row's comment).
#
# The two `unsupported` rows are statements about the encoder, not about
# `oxiarc`, and since the 2026-09-14 encoder rules landed they are the *same*
# statement: a `&mut` borrow taken at an index the encoder knows only
# symbolically -- `<[T; N] as IndexMut<I>>::index_mut` over a symbolic window,
# and `<Vec<T, A> as IndexMut<I>>::index_mut` at a symbolically indexed
# element. Both are cargo-formal TODO P3-26. `README.md` says what they need.
#
# Re-measured 2026-09-15 with the Phase 3 release CLI (options: autoharness
# off, modular on, vacuity check on; release cargo-formal 0621fc0, 0
# uncommitted files, OxiZ 0.3.3, rustc nightly-2026-06-20, --jobs 4, fresh
# --target-dir, two runs): every row, the `peek_bits_count_bound_is_necessary_harness`
# counterexample (count = 255), the one timeout and both refusal sites
# unchanged; bmc 505 proved / 2 refuted / 1 timeout / 2 unsupported over 510
# obligations (508 with a reproduction record), contract 0 proved / 0
# refuted, hygiene PASS, exit 1, 35 s and 34 s. run1<->run2 is
# byte-identical. **One counterexample moved**: `refill_bytes_want_bound_is_asserted_harness#panic`
# refutes at want = 57 now, not want = 128 (see that row's comment) -- still
# a real, model-checked witness of the same violated property (want > 56),
# reproduced identically in both 2026-09-15 runs; verified, not inferred --
# `diff`-ing this item's own `vc/0117.smt2` against the 2026-09-14 target
# dir's copy of the same ordinal shows the scripts are genuinely different
# (107 lines then, 32 now; the 2026-09-14 script hand-unrolls ~14 `ite`-chained
# byte comparisons the 2026-09-15 script does not), not merely re-ordered --
# consistent with the encoder's hypothesis assembly having been rebuilt since
# 2026-09-14 (design phase3.md waves 1-4). Against the 2026-09-14 report
# (`compare_expected.py --prev`): 0 added/removed ids, 0 FLIPs, 504
# message-only changes -- every harness that draws a sequence gains the
# Phase 3 clause `bounded-sequence: sequences cut at N` on its
# `arith-overflow`/`bounds-check`/`shift-overflow`/`unwinding-assertion`
# conditions (e.g. `align_to_byte_leaves_whole_bytes_harness#arith-overflow@../oxiarc-core/src/bitstream.rs:150:9`:
# `inlined at src/harness.rs:224:5` -> `bounded-sequence: sequences cut at
# 16; inlined at src/harness.rs:224:5`); no verdict moved. The
# `solver-model-rejected` count stays 0. `coverage.claim` now appears
# (`claim unmet 505 of 505 proved`) where 2026-09-14 had none -- confirmed
# from `crates/formal-config/src/resolved.rs`'s `defaults::claim_requires()`
# to be an unconditional CLI default (`["lrat", "oxilean-verify",
# "external-replay"]`) applied to every package that does not set
# `claim-requires` in its manifest, regardless of `self_host` -- a new
# Phase 3 default report surface for every package, not a verdict row.

