[[harness]]
name = "peek_bits_count_bound_is_necessary_harness"

[harness.expected]
"panic" = "refuted"  # `debug_assert!(count <= 32)`; counterexample count = 255
# The shift the assertion protects is proved, not refuted: the encoder
# continues along the edge where the assertion holds, so `1u64 << count` at
# `bitstream.rs:136` is only reachable with `count <= 32`. 2 sites.
"shift-overflow" = "proved"

