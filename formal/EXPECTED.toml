name = "from_code_lengths_never_panics_harness"

[harness.expected]
# `unsupported(aliasing)` at `../oxiarc-deflate/src/huffman.rs:363:28`: the
# callee is `<Vec<T, A> as IndexMut<I>>::index_mut`, which "takes a mutable
# borrow of a symbolically indexed element". Column 28 is the `[idx]` of
# `symbols[idx] = symbol as u16` in `build_into`'s symbol-assignment loop,
# whose index is
# `symbol_offsets[len] + (current_code[len] - base_codes[len])` -- symbolic in
# the code lengths the harness draws. That is the same design limit that
# refuses `xxhash32_one_shot_equals_streaming_harness` (cargo-formal TODO
# P3-26). No verification condition is generated.
#
# Measured 2026-09-14 with the rebuilt CLI. The refusal MOVED, and the older
# explanation of it was wrong in an instructive way: it read
# `unsupported-callee` at `../oxiarc-core/src/error.rs:190:22`, "no
# `From<&str> for std::string::String` implementation in the module set", and
# that did NOT mean the table builder was one `From<&str> for String` rule
# short. The rule was there; the copy was refused on LENGTH, because the
# literal `"Empty code lengths"` (`huffman.rs:272`) is 18 bytes against this
# package's sequence bound of 16, and the generic-conversion path swallowed
# that error and reported its own fallback message instead. With the length
# check fixed, the encoder now walks the whole `impl Into<String>`
# constructor, the `1..=max_length` loop (`huffman.rs:302`), the `format!`
# inside `invalid_header(format!(..))` (`huffman.rs:282`) and
# `code_lengths.len().next_power_of_two()` (`huffman.rs:332`) before stopping
# at the write above. The blockers predicted before the first run
# (`Iterator::sum` at `huffman.rs:311`, `Vec::resize`, `Vec::reserve_exact`)
# are walked past as well. None of this moved a counter: the package is still
# bmc 505 proved / 2 refuted / 0 unknown / 1 timeout / 2 unsupported over 510
# obligations, and this harness still mints no verification condition.
"harness" = "unsupported"
