[package]
name = "oxiarc-archive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
description = "Archive container format support for OxiArc (ZIP, TAR, GZIP, LZH, XZ)"
keywords = ["archive", "zip", "tar", "gzip", "xz"]
categories = ["compression", "encoding", "filesystem"]
exclude = ["TODO.md"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Memory-mapped file support for efficient large file reading
mmap = ["oxiarc-core/mmap"]
# Async I/O support via Tokio
async-io = ["oxiarc-core/async-io", "dep:tokio"]
# Archive-level oracle tests (tests/lzh_lha_oracle.rs) that shell out to the
# real `lha` CLI (Lhasa, decompress-only) to prove that LZH archives produced
# by `LzhWriter` are readable by an independent LHA implementation: `lha l`
# (list), `lha t` (CRC-16 test) and `lha x`/`lha p` (extract + byte-diff).
# Mirrors the `lha-oracle` feature in `oxiarc-lzhuf` (which validates the codec
# stream); this one validates the surrounding archive headers. Self-skips (with
# a printed note, no failure) when `lha` is not on PATH. Never enabled by
# default; not needed for normal library use.
lha-oracle = []
# Archive-level oracle tests (tests/zip_cli_interop.rs) that shell out to the
# real Info-ZIP `zip`/`unzip` CLIs and Python's `zipfile` module to prove
# bidirectional ZIP interop: externally-created archives (stored, deflate,
# zip64, data-descriptor, `zip -e` ZipCrypto) are read and their encryption
# detected correctly, and oxiarc-written archives (plain, ZipCrypto, AES)
# pass `unzip -t` / `zipfile` inspection. Self-skips (with a printed note,
# no failure) when a tool is not on PATH. Never enabled by default.
zip-oracle = []
# Archive-level oracle tests (tests/xz_cli_interop.rs) that shell out to the
# real XZ Utils `xz` CLI: `xz -6` output (including multi-chunk LZMA2
# blocks) must decode byte-exactly at the archive level, and oxiarc-written
# `.xz` must pass `xz -t` and round-trip through `xz -dc`. Self-skips when
# `xz` is not on PATH. Never enabled by default.
xz-oracle = []

[dependencies]
oxiarc-core.workspace = true
oxiarc-deflate.workspace = true
oxiarc-lzhuf.workspace = true
oxiarc-lzma.workspace = true
oxiarc-lz4.workspace = true
oxiarc-zstd.workspace = true
oxiarc-bzip2.workspace = true
oxiarc-brotli.workspace = true
oxiarc-snappy.workspace = true
encoding_rs.workspace = true
tokio = { workspace = true, optional = true }

[lints]
workspace = true
