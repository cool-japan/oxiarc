[package]
name = "oxiarc-tiff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Pure Rust TIFF 6.0 / BigTIFF / GeoTIFF-tag-preserving reader and writer for OxiArc (LZW, Deflate, PackBits, CCITT, JPEG, ZSTD, LZMA)"
readme = "README.md"
keywords = ["tiff", "bigtiff", "geotiff", "image", "decoder"]
categories = ["multimedia::images", "multimedia::encoding", "encoding"]
exclude = ["TODO.md"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["deflate", "lzw", "packbits", "ccitt"]
# Compression 8 / 32946 (zlib-wrapped DEFLATE), through `oxiarc-deflate`.
deflate = ["dep:oxiarc-deflate", "dep:oxiarc-core"]
# Compression 5 (TIFF LZW, MSB-first, early change), through `oxiarc-lzw`.
lzw = ["dep:oxiarc-lzw"]
# Compression 32773 (Apple PackBits). Always compiled -- it needs no
# dependency and `--no-default-features` must still decode it -- so this
# feature exists only so `features = ["packbits"]` keeps working.
packbits = []
# Compression 2 / 3 / 4 / 32771 (CCITT MH, Group 3, Group 4, RLE word).
# In-crate, no dependency.
ccitt = []
# Compression 50000 (Zstandard), through `oxiarc-zstd`.
zstd = ["dep:oxiarc-zstd"]
# Compression 34925 (LZMA2 in an `.xz` stream per chunk), through
# `oxiarc-lzma`.
lzma = ["dep:oxiarc-lzma"]
# Compression 7 (TTN2 JPEG) and best-effort 6 (old-style JPEG), through
# `oxiarc-jpeg`.
jpeg = ["dep:oxiarc-jpeg"]
# Every codec this crate implements.
all-codecs = ["deflate", "lzw", "packbits", "ccitt", "zstd", "lzma", "jpeg"]
# Differential oracle tests (tests/tiff_oracle.rs) that shell out to libtiff's
# `tiffcp`/`tiffinfo` and to `python3` with Pillow / tifffile. They validate
# both directions: reference-written TIFFs must decode byte-identically here,
# and oxiarc-written TIFFs must be accepted by the reference tools. Every test
# self-skips (prints a note, does not fail) when the tool is absent, exactly
# like `oxiarc-snappy`'s `snappy-oracle`. Never needed for library use.
tiff-oracle = []
# Parallel strip/tile decode and encode through `rayon`. Off by default so the
# crate stays wasm32-buildable (wasm32 has no threads). Output is identical to
# the serial path -- see `tests/rayon_parallel.rs`.
rayon = ["dep:rayon"]
# `Decoder::from_path`, a memory-mapped `Read + Seek` source built on
# `oxiarc_core::mmap::MappedFile`. Good for random tile access (COG-style);
# roughly neutral for a linear whole-image read.
mmap = ["dep:oxiarc-core", "oxiarc-core/mmap"]
# A `tiff`-0.11-shaped `Decoder`/`DecodingResult`/`TiffEncoder`/`ImageEncoder`
# facade (`compat::*`) for a drop-in migration from the `tiff` crate (and,
# transitively, from `image`'s `tiff` codec). Pulls in `half` for the frozen
# `DecodingResult::F16(Vec<half::f16>)` variant; the native API never needs it.
compat = ["dep:half"]

[dependencies]
thiserror = { workspace = true }
oxiarc-core = { workspace = true, optional = true }
oxiarc-deflate = { workspace = true, optional = true }
oxiarc-lzw = { workspace = true, optional = true }
oxiarc-zstd = { workspace = true, optional = true }
oxiarc-lzma = { workspace = true, optional = true }
oxiarc-jpeg = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
half = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "tiff_bench"
harness = false

[lints]
workspace = true
