[package]
name = "oxiarc-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "HTTP content-coding (RFC 9110 Content-Encoding / Accept-Encoding: gzip, deflate, br, zstd) for OxiArc - Pure Rust, bounded, incremental"
readme = "README.md"
keywords = ["http", "gzip", "content-encoding", "brotli", "zstd"]
categories = ["compression", "web-programming::http-client", "web-programming::http-server"]
exclude = ["TODO.md"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["gzip", "deflate"]
# RFC 1952 gzip / x-gzip. Both sides: `encode_body`/`Encoder`, and the
# `Decoder`/`DecodedBody` gzip stage (multi-member, RFC 1952 §2.2).
gzip = ["dep:oxiarc-deflate"]
# RFC 1950 zlib-wrapped deflate (and the RFC 9110 §8.4.1.2 raw-deflate sniff,
# decode side only). Shares `oxiarc-deflate` with `gzip`; the two features are
# independent switches over the same dependency.
deflate = ["dep:oxiarc-deflate"]
# RFC 7932 Brotli.
brotli = ["dep:oxiarc-brotli"]
# RFC 8878 Zstandard, and `dcz` (Compression Dictionary Transport, RFC 9842)
# when a dictionary is supplied — see `EncodeOptions::dictionary`.
zstd = ["dep:oxiarc-zstd"]
# Legacy UNIX `compress` / `x-compress`. Plumbing only in this wave: `oxiarc-lzw`
# caps codes at 12 bits (`LzwConfig::validate`) and the `.Z` format needs 16, so
# `ContentCoding::Compress::is_decodable()`/`is_encodable()` are unconditionally
# `false` regardless of this feature until that lands upstream. Kept as a real
# Cargo feature (rather than a `compile_error!`) so the crate's feature matrix —
# `--no-default-features`, each feature alone — stays green.
compress = ["dep:oxiarc-lzw"]
# `AsyncDecodedBody`, the `tokio::io::AsyncRead` twin of `DecodedBody`.
async-io = ["dep:tokio", "oxiarc-core/async-io"]
# Differential oracle tests (tests/http_oracle.rs) that decode streams built
# by CPython's `zlib`/`gzip` modules and by the reference `brotli` / `zstd`
# CLIs, rather than by oxiarc's own encoders. Self-skips (does not fail) at
# runtime when a tool is absent, matching the established `zlib-oracle` /
# `brotli-oracle` / `zstd-oracle` pattern. Never enabled by default; not
# needed for normal library use.
http-oracle = []

[dependencies]
oxiarc-core = { workspace = true }
oxiarc-deflate = { workspace = true, optional = true }
oxiarc-brotli = { workspace = true, optional = true }
oxiarc-zstd = { workspace = true, optional = true }
oxiarc-lzw = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
# The tests, examples and benches build fixtures with the matching oxiarc
# encoders, so they need these unconditionally — the library's own use of
# them stays feature-gated and optional above.
oxiarc-deflate = { workspace = true }
oxiarc-brotli = { workspace = true }
oxiarc-zstd = { workspace = true }
# tests/cross_crate_inflate.rs only: proves a PNG IDAT stream, a TIFF
# deflate strip and an HTTP gzip body all decode byte-identically through
# the same oxiarc-deflate core, however the input is split. Both crates'
# own default features are used as-is (PNG has no cargo features to gate
# the base codec; TIFF's `deflate` codec is in its default feature set).
oxiarc-png = { workspace = true }
oxiarc-tiff = { workspace = true }

[[bench]]
name = "decode_bench"
harness = false

[lints]
workspace = true
