[workspace]
resolver = "2"
members = [
    "oxiarc-core",
    "oxiarc-deflate",
    "oxiarc-lzhuf",
    "oxiarc-lzw",
    "oxiarc-bzip2",
    "oxiarc-lz4",
    "oxiarc-zstd",
    "oxiarc-brotli",
    "oxiarc-archive",
    "oxiarc-cli",
    "oxiarc-lzma",
    "oxiarc-snappy",
    "oxiarc-szip",
    "oxiarc-http",
    "oxiarc-png",
    "oxiarc-jpeg",
    "oxiarc-tiff",
    "oxiarc-image",
]

[workspace.package]
version = "0.4.3"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/cool-japan/oxiarc"
homepage = "https://github.com/cool-japan/oxiarc"
authors = ["COOLJAPAN OU (Team KitaSan)"]
description = "Pure Rust archive/compression library - The Oxidized Archiver"
keywords = ["archive", "compression", "zip", "lzh", "deflate"]
categories = ["compression", "encoding"]

[workspace.dependencies]
# Internal crates
oxiarc-core = { version = "0.4.3", path ="oxiarc-core" }
oxiarc-deflate = { version = "0.4.3", path ="oxiarc-deflate" }
oxiarc-lzhuf = { version = "0.4.3", path ="oxiarc-lzhuf" }
oxiarc-lzw = { version = "0.4.3", path ="oxiarc-lzw" }
oxiarc-lzma = { version = "0.4.3", path ="oxiarc-lzma" }
oxiarc-bzip2 = { version = "0.4.3", path ="oxiarc-bzip2" }
oxiarc-lz4 = { version = "0.4.3", path ="oxiarc-lz4" }
oxiarc-zstd = { version = "0.4.3", path ="oxiarc-zstd" }
oxiarc-snappy = { version = "0.4.3", path ="oxiarc-snappy" }
oxiarc-brotli = { version = "0.4.3", path ="oxiarc-brotli" }
oxiarc-archive = { version = "0.4.3", path ="oxiarc-archive" }
oxiarc-szip = { version = "0.4.3", path = "oxiarc-szip" }
oxiarc-http = { version = "0.4.3", path = "oxiarc-http" }
oxiarc-png = { version = "0.4.3", path = "oxiarc-png" }
oxiarc-jpeg = { version = "0.4.3", path = "oxiarc-jpeg" }
oxiarc-tiff = { version = "0.4.3", path = "oxiarc-tiff" }
oxiarc-image = { version = "0.4.3", path = "oxiarc-image" }

# External dependencies
thiserror = "2.0.18"
# Capped below 0.8.40: encoding_rs 0.8.40+ pulls in `multiversion` for SIMD
# dispatch and requires rustc 1.88, but this workspace's MSRV is 1.85
# (`rust-version` above, enforced by `cargo +1.85.0 check --workspace` and
# clippy.toml's `msrv` gate) — 0.8.35..<0.8.40 is the real latest range that
# still builds on 1.85. Raise the cap once the workspace MSRV moves to 1.88+.
encoding_rs = ">=0.8.35, <0.8.40"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.7"
indicatif = "0.18.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
dialoguer = "0.12.0"
filetime = "0.2.29"
owo-colors = "4.3.0"
supports-color = "3.0.2"
clap_mangen = "0.3.0"
rpassword = "7.5.4"
rayon = "1.12.0"
tokio = { version = "1.52.3", features = ["io-util", "rt", "macros", "sync"] }
memmap2 = "0.9.11"
criterion = "0.8.2"
weezl = "0.2.1"
glob = "0.3.3"
proptest = "1.11.0"
half = "2.7.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1
