[package]
name = "oxiarc-deflate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
description = "Pure Rust DEFLATE compression algorithm (RFC 1951) for OxiArc"
keywords = ["deflate", "compression", "huffman", "lz77", "zlib"]
categories = ["compression", "encoding"]
exclude = ["TODO.md"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# Async I/O support via Tokio - implements AsyncCompressor/AsyncDecompressor for Deflater/Inflater
async-io = ["oxiarc-core/async-io", "dep:tokio"]
# Parallel compression using rayon thread pool (pigz-style multi-member GZIP)
parallel = ["dep:rayon"]
# Live differential tests (tests/zlib_oracle.rs) that shell out to `python3`
# (zlib/gzip modules) and the system `gzip` CLI as reference codecs. The
# tests self-skip when the reference tools are absent, so enabling the
# feature is always safe. Implies `parallel` to cover multi-member output
# from compress_gzip_parallel.
zlib-oracle = ["parallel"]

[dependencies]
oxiarc-core.workspace = true
tokio = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "lz77_bench"
harness = false

[[bench]]
name = "deflate_bench"
harness = false

[lints]
workspace = true
