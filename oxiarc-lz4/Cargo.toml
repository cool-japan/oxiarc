[package]
name = "oxiarc-lz4"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Pure Rust LZ4 compression implementation with LZ4-HC"
readme = "README.md"
keywords = ["lz4", "compression", "decompression", "lz4hc", "xxhash"]
categories = ["compression", "encoding"]
exclude = ["TODO.md"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
oxiarc-core = { workspace = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

[[bench]]
name = "lz4_bench"
harness = false

[features]
default = []
parallel = ["rayon"]
# Enables differential interop tests that shell out to the reference `lz4` CLI.
# The tests self-skip when the binary is not on PATH, so enabling this feature
# is always safe; without it the interop tests are compiled out entirely.
lz4-oracle = []

[lints]
workspace = true
