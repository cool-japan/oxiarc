[package]
name = "oxiarc-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
description = "Command-line interface for OxiArc archive operations"
keywords = ["cli", "archive", "compression", "zip", "lzh"]
categories = ["command-line-utilities", "compression"]
exclude = ["*.bak", "*.backup", "TODO.md", "tests/**"]

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "oxiarc"
path = "src/main.rs"

[dependencies]
oxiarc-core.workspace = true
oxiarc-archive.workspace = true
oxiarc-lzma.workspace = true
# Image-format recognition for `detect`/`info` only (a CLI-layer fallback,
# never wired into `ArchiveFormat` — see repo-conventions.md §13's cost
# table). `oxiarc-image` is deliberately not a dependency here: it is a
# thin re-encoding facade, not a detection/inspection surface, so it would
# add a dependency edge for no benefit over talking to these three crates
# directly.
oxiarc-png.workspace = true
oxiarc-jpeg.workspace = true
oxiarc-tiff.workspace = true
clap.workspace = true
clap_complete.workspace = true
indicatif.workspace = true
serde.workspace = true
serde_json.workspace = true
dialoguer.workspace = true
glob.workspace = true
filetime.workspace = true
owo-colors.workspace = true
supports-color.workspace = true
clap_mangen.workspace = true
rpassword.workspace = true

[lints]
workspace = true
