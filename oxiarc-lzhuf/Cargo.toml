[package]
name = "oxiarc-lzhuf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
description = "Pure Rust LZH (LZSS + Huffman) compression for OxiArc"
keywords = ["lzh", "lha", "lzss", "compression", "huffman"]
categories = ["compression", "encoding"]

[features]
parallel = ["dep:rayon"]
# Encode-direction oracle tests (tests/lha_oracle.rs) that shell out to the
# real `lha` CLI (Lhasa) to validate OxiArc-produced archives. Implies
# `parallel`, whose `lzh_compress_parallel` builds the minimal single-entry
# test archives. Self-skips (does not fail) at runtime if `lha` is not on
# PATH. Never enabled by default; not needed for normal library use.
lha-oracle = ["parallel"]

[dependencies]
oxiarc-core.workspace = true
rayon = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "lzhuf_bench"
harness = false

[lints]
workspace = true
