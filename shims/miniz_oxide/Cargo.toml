[package]
name = "miniz_oxide"
version = "0.8.9"
edition = "2024"
rust-version = "1.85"
publish = false
license = "Apache-2.0"
authors = ["COOLJAPAN OU (Team KitaSan)"]
description = "Local [patch.crates-io] shim: the `miniz_oxide` 0.8.9 API re-exported from oxiarc-miniz-compat (Pure Rust, COOLJAPAN OxiARC). NOT the upstream crate; never published."

[dependencies]
oxiarc-miniz-compat = { path = "../../oxiarc-miniz-compat" }

# Every feature name of the upstream crate at this version (explicit and
# implicit optional-dependency features), all no-ops: Cargo rejects a
# [patch] whose package lacks a feature some dependent enables, and then
# silently keeps the real crate.
[features]
default = ["with-alloc"]
alloc = []
"block-boundary" = []
core = []
"rustc-dep-of-std" = []
serde = []
simd = []
"simd-adler32" = []
std = []
"with-alloc" = []

# Standalone workspace: keeps these same-name packages (banned names in
# deny.toml) out of the oxiarc workspace and its Cargo.lock.
[workspace]
