[package]
name = "oxiarc-jpeg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Pure Rust JPEG (ITU-T T.81) decoder and encoder for OxiArc: baseline, extended, progressive, lossless, arithmetic; abbreviated streams for TIFF"
readme = "README.md"
keywords = ["jpeg", "jpg", "image", "encoder", "decoder"]
categories = ["multimedia::images", "multimedia::encoding", "encoding"]
exclude = ["TODO.md"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["arithmetic"]
# Arithmetic entropy coding (SOF9/10/11, DAC). The `DAC` segment is always
# parsed, stored and re-emitted; this feature gates the entropy coder itself.
arithmetic = []
# Parallel entropy coding across restart intervals, via rayon. Decoding and
# encoding both produce byte-identical results with and without it; the
# feature only affects how the work is scheduled.
rayon = ["dep:rayon"]
# Live differential tests (tests/jpeg_oracle.rs) that shell out to
# libjpeg-turbo's `cjpeg`/`djpeg` and to `python3`+Pillow to assert
# byte-identical decoding against `djpeg -dct int`. The tests self-skip (they
# print a note and pass) when the reference tools are absent. Never enabled by
# default; not needed for normal library use.
jpeg-oracle = []

[dependencies]
oxiarc-core = { workspace = true }
rayon = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "decode_bench"
harness = false

[[bench]]
name = "encode_bench"
harness = false

[lints]
workspace = true
